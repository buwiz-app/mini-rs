[workspace]
resolver = "3"
members = ["crates/hello-mini-app", "crates/hello-screens"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# The SDK, pinned by commit, each crate once here and inherited by the members
# (`workspace = true`); a new SDK is a new rev (then run tools/check-all.sh).
buwiz-plugin = { git = "https://github.com/buwiz-app/buwiz-sdk", rev = "f63038d5cdbb05a20d9f329be3a85a8a6f3e8f8d" }
buwiz-app = { git = "https://github.com/buwiz-app/buwiz-sdk", rev = "f63038d5cdbb05a20d9f329be3a85a8a6f3e8f8d" }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
