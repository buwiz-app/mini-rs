[workspace]
resolver = "3"
members = ["crates/hello-mini-app", "crates/hello-screens"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# The SDK, pinned by commit, each crate once here and inherited by the members
# (`workspace = true`); a new SDK is a new rev (then run tools/check-all.sh).
buwiz-plugin = { git = "https://github.com/buwiz-app/buwiz-sdk", rev = "8f95537270815e75d0a23488ca12d175138c6d91" }
buwiz-app = { git = "https://github.com/buwiz-app/buwiz-sdk", rev = "8f95537270815e75d0a23488ca12d175138c6d91" }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
